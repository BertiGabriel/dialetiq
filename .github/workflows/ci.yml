name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dialetiq
          POSTGRES_PASSWORD: dialetiq
          POSTGRES_DB: dialetiq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dialetiq"
          --health-interval 5s --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # The architecture, as an executable contract. Without this, hexagonal
      # is decoration: domain/ starts importing SQLAlchemy, modules start
      # importing each other's internals, platform/ becomes the god-module,
      # and nobody notices for six months. See ADR 0002.
      - name: Architecture contracts
        run: uv run lint-imports

      # Tenant isolation. The most important suite in the project: it is what
      # separates real multi-tenancy from multi-tenancy-until-the-first-leak.
      - name: Tests (incl. tenant isolation)
        env:
          DIALETIQ_DATABASE_URL: postgresql+psycopg://dialetiq:dialetiq@localhost:5432/dialetiq
        run: uv run pytest

  forbidden-patterns:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The three ways to silently break tenant isolation. Each looks harmless
      # in review, passes every test, and leaves every tenant's data readable
      # by every other tenant. See platform/db/session.py.
      #
      # AST-based, not grep: session.py documents all three patterns in prose,
      # and a grep flags its own documentation.
      - name: No connection-leaking session state
        run: uv run python scripts/check_forbidden_patterns.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A secret committed to git is in the history forever. gitleaks is the
      # second line; .gitignore only protects people who did not use `git add -f`.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
