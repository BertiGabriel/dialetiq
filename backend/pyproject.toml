[project]
name = "dialetiq"
version = "0.0.0"                # placeholder: the git tag is the source of truth
description = "Multi-tenant campaign and engagement platform"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    # psycopg3, not asyncpg: far less friction with PgBouncer/Neon's pooler,
    # and no prepared-statement cache to disable. See CLAUDE.md.
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",         # OWASP's first choice for password hashing
    "structlog>=24.4",
    "redis>=5.2",
    "httpx[http2]>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "import-linter>=2.1",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialetiq"]

# ---------------------------------------------------------------------------
# Ruff — lint + format. Replaces flake8, black, isort, pyupgrade.
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "S",         # bandit (security)
    "ASYNC",     # async pitfalls
    "T20",       # no print()
    "RUF",
]
ignore = [
    "S101",      # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]     # hardcoded test credentials are fine

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# import-linter — THIS IS THE ARCHITECTURE.
#
# The folder layout is a suggestion. These contracts are the contract. Without
# them running in CI, hexagonal architecture is decoration and rots in months.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "dialetiq"

# 1. Hexagonal layers. Domain knows nothing. Adapters know everything.
[[tool.importlinter.contracts]]
name = "Hexagonal layers are respected inside every module"
type = "layers"
layers = ["adapters", "application", "domain"]
containers = [
    "dialetiq.modules.identity",
    "dialetiq.modules.engagement",
    "dialetiq.modules.commerce",
]

# 2. Modules are independent. They may only reach each other through api.py,
#    as in-process calls — never over HTTP (that would be a distributed
#    monolith: network latency and failure modes, no benefit). See ADR 0002.
[[tool.importlinter.contracts]]
name = "Modules do not import each other's internals"
type = "independence"
modules = [
    "dialetiq.modules.identity",
    "dialetiq.modules.engagement",
    "dialetiq.modules.commerce",
]
# api.py is the only public surface; ignore imports that go through it.
ignore_imports = [
    "dialetiq.modules.* -> dialetiq.modules.*.api",
]

# 3. platform/ is dumb infrastructure. It must NEVER import a module.
#    This is the line that stops it from becoming the god-module that a
#    shared core/ folder always becomes.
[[tool.importlinter.contracts]]
name = "platform never imports a module"
type = "forbidden"
source_modules = ["dialetiq.platform"]
forbidden_modules = ["dialetiq.modules"]

# 4. The domain is pure. No framework, no ORM, no I/O.
[[tool.importlinter.contracts]]
name = "Domain and application import no infrastructure"
type = "forbidden"
source_modules = [
    "dialetiq.modules.identity.domain",
    "dialetiq.modules.identity.application",
    "dialetiq.modules.engagement.domain",
    "dialetiq.modules.engagement.application",
    "dialetiq.modules.commerce.domain",
    "dialetiq.modules.commerce.application",
]
forbidden_modules = [
    "sqlalchemy",
    "fastapi",
    "psycopg",
    "redis",
    "httpx",
]
